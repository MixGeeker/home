<title>自建房三维模型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-height split — a drafting-table side panel beside a live 3D viewport; on phones the panel drops below the model. */
:root {
  --bg: #f3f4f3;
  --panel: #fbfbfa;
  --fg: #1c2125;
  --muted: #5a646b;
  --line: #d5dadc;
  --accent: #b9552f;
  --accent-ink: #ffffff;
  --chip: rgba(251,251,250,.92);
  --scene: #dfe7ec;
  --ground: #c8ccc4;
  --road: #9a9e9f;
  --font-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131719; --panel: #1a1f22; --fg: #e6eaec; --muted: #98a2a9; --line: #2b3338;
    --accent: #e07a4f; --accent-ink: #1a1f22; --chip: rgba(26,31,34,.9);
    --scene: #1d2429; --ground: #2a2f2b; --road: #3a3e40; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131719; --panel: #1a1f22; --fg: #e6eaec; --muted: #98a2a9; --line: #2b3338;
  --accent: #e07a4f; --accent-ink: #1a1f22; --chip: rgba(26,31,34,.9);
  --scene: #1d2429; --ground: #2a2f2b; --road: #3a3e40; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); }
#app { height: 100%; display: grid; grid-template-columns: 330px 1fr; }
#panel {
  background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto;
  padding-block: 20px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px;
  display: flex; flex-direction: column; gap: 18px; min-width: 0;
}
#view { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--scene); }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
h1 { font-size: 20px; font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .02em; }
.sub { margin: 4px 0 0; color: var(--muted); font-family: var(--font-num); font-size: 12px; }
.eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button {
  font: 500 13px var(--font-ui); padding: 8px 0; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
}
.seg button span { font-family: var(--font-num); }
.seg button:hover { border-color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible, .tg input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggles { display: flex; flex-direction: column; gap: 8px; }
.tg { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.tg input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
#info h2 { font-size: 15px; margin: 0 0 2px; }
#info .meta { font-family: var(--font-num); font-size: 12px; color: var(--muted); margin: 0 0 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { text-align: left; padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 11px; letter-spacing: .08em; }
td.n, th.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }
tr.click { cursor: pointer; }
tr.click:hover td { color: var(--accent); }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 0; }
.hint {
  position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px;
  font-size: 12px; color: var(--muted); background: var(--chip); border: 1px solid var(--line);
  padding: 5px 9px; border-radius: 6px; pointer-events: none;
}
.lbl {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  background: var(--chip); color: var(--fg); border: 1px solid var(--line);
  padding: 3px 7px; border-radius: 5px; font: 500 12px var(--font-ui); white-space: nowrap; pointer-events: none;
}
.lbl span { font: 400 10.5px var(--font-num); color: var(--muted); }
.dim { font: 500 10.5px var(--font-num); color: var(--accent); background: var(--chip); padding: 0 4px; border-radius: 3px; pointer-events: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tip {
  position: absolute; z-index: 100000; pointer-events: none; background: var(--panel); color: var(--fg);
  border: 1px solid var(--accent); border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.5;
  box-shadow: 0 4px 14px rgba(0,0,0,.15); white-space: nowrap;
}
.tip b { display: block; font-weight: 700; }
.tip span { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
#err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(300px, 58%) 1fr; }
  #panel { border-right: 0; border-top: 1px solid var(--line); order: 2; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; gap: 14px; }
  #view { order: 1; }
  .seg { grid-template-columns: repeat(7, 1fr); }
  .seg button { font-size: 12px; padding: 7px 0; }
}
</style>

<div id="app">
  <aside id="panel">
    <header>
      <h1>自建房三维模型</h1>
      <p class="sub">9.0 × 10.0 m · 六层 · 檐口 +20.700</p>
    </header>
    <div>

  <div id="view">

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const view = document.getElementById('view');

/* ---------- 楼层数据（来自图纸） ---------- */
const SLAB = 0.12, TE = 0.24, TI = 0.12;
const LV = { 1: { b: 0, h: 3.8 }, 2: { b: 3.8, h: 3.2 }, 3: { b: 7.0, h: 3.2 }, 4: { b: 10.2, h: 3.2 }, 5: { b: 13.4, h: 3.2 }, 6: { b: 16.6, h: 3.6 } };
const FLOORS = {
  1: { name: '首层', elev: '±0.000', use: '车库、门厅、储物间、卫生间' },
  2: { name: '二层', elev: '+3.800', use: '客厅、餐厅、厨房、卫生间' },

  5: { name: '五层', elev: '+13.400', use: '两间卧室、两个卫生间、阳台' },

// 房间：[名称, 地面材质, [[x0,x1,z0,z1],...], 标签位置 [x,z]]   x 为面宽方向（0~9），z 为进深方向（0 在后墙，10 临街）
const ROOMS = {
  1: [
    ['车库 / 门厅', 'tile', [[0.24, 8.76, 2.5, 8.36], [3.4, 5.0, 0.24, 2.5]], [6.6, 5.4]],
    ['储物间', 'tile', [[0.24, 1.6, 0.24, 2.44]], [0.9, 1.3]],
    ['楼梯', 'stone', [[5.0, 7.4, 0.24, 2.44], [7.4, 8.76, 0.24, 1.19]], [6.2, 1.9]],
    ['卫生间', 'bath', [[7.46, 8.76, 1.31, 2.44]], [8.1, 1.9]],
    ['电梯', null, [[1.72, 3.28, 0.3, 2.38]], [2.5, 1.3]],
    ['门廊', null, [[0, 9, 8.6, 10]], [4.5, 9.3]],
  ],
  2: [
    ['客厅', 'wood', [[0.24, 5.0, 2.5, 9.76]], [2.4, 5.4]],
    ['餐厅', 'wood', [[5.0, 8.76, 2.56, 7.0]], [7.0, 6.2]],
    ['厨房', 'tile', [[5.06, 8.76, 7.06, 9.76]], [7.2, 9.3]],
    ['卫生间', 'bath', [[0.24, 1.6, 0.24, 2.71]], [0.9, 1.4]],
    ['电梯厅', 'stone', [[3.4, 5.0, 0.24, 2.44]], [4.2, 1.6]],
    ['楼梯', null, [[5.0, 8.76, 0.24, 2.44]], [6.5, 1.8]],
  ],
  std: [
    ['卧室 A', 'wood', [[1.6, 5.0, 3.66, 8.5], [0.24, 1.6, 4.36, 8.5], [1.6, 4.14, 2.5, 3.66]], [3.0, 6.0]],
    ['卧室 B', 'wood', [[5.06, 8.76, 4.56, 9.76], [5.06, 5.94, 2.56, 4.56]], [6.0, 7.0]],
    ['卫生间 A', 'bath', [[0.24, 1.54, 0.24, 4.24]], [0.9, 2.8]],
    ['卫生间 B', 'bath', [[6.06, 8.76, 2.56, 4.44]], [7.2, 3.6]],
    ['阳台', 'tile', [[0.24, 4.94, 8.56, 10.0]], [2.6, 9.3]],
    ['电梯厅 / 过道', 'stone', [[3.4, 5.0, 0.24, 2.44], [4.2, 5.0, 2.5, 3.6]], [4.2, 1.6]],
    ['楼梯', null, [[5.0, 8.76, 0.24, 2.44]], [6.5, 1.8]],
  ],
  6: [
    ['露台', 'deck', [[0.24, 8.76, 2.62, 9.76]], [4.5, 4.6]],
    ['卫生间', 'bath', [[0.24, 1.6, 0.24, 2.38]], [0.9, 1.3]],
    ['电梯厅', 'stone', [[3.4, 5.0, 0.24, 2.38]], [4.2, 1.6]],
    ['楼梯', null, [[5.0, 8.76, 0.24, 2.38]], [6.5, 1.8]],
  ],
};
ROOMS[5] = ROOMS.std;
// 三楼：父母房中房，两间卧室各带卫生间，中间隔音门互通
ROOMS[3] = ROOMS.std.map(r => r[0] === '卧室 A' ? ['卧室 A · 带阳台', ...r.slice(1)] : r[0] === '卧室 B' ? ['卧室 B', ...r.slice(1)] : r[0] === '电梯厅 / 过道' ? ['电梯厅', 'stone', [[3.4, 5.0, 0.24, 2.44]], [4.2, 1.4]] : r);
ROOMS[3] = ROOMS[3].map(r => r[0] === '卧室 B' ? ['卧室 B', 'wood', [[5.06, 8.76, 4.56, 9.76]], [6.6, 7.0]] : r[0] === '卫生间 B' ? ['卫生间 B', 'bath', [[5.06, 8.76, 2.56, 4.44]], [6.6, 3.6]] : r);
ROOMS[3][0] = ['卧室 A · 带阳台', 'wood', [...ROOMS.std[0][2], [4.2, 5.0, 2.5, 3.6]], [3.0, 6.0]];
ROOMS[3].push(['隔音互通门', null, null, [5.0, 5.1]]);
// 四楼：一室套房（A、B 两间卧室打通）
ROOMS[4] = [
  ['洗浴区', 'bath', [[0.24, 1.6, 0.24, 2.5], [0.24, 3.0, 2.5, 4.3]], [1.2, 3.7]],
  ['衣帽间', 'wood', [[0.24, 3.0, 4.3, 8.5]], [1.6, 7.3]],
  ['洗衣区', 'tile', [[0.24, 2.94, 8.5, 9.76]], [1.6, 9.3]],
  ['卧室 + 影音区', 'wood', [[3.06, 5.0, 4.5, 9.76], [5.0, 8.76, 4.56, 9.76]], [7.0, 6.9]],
  ['玄关 · 手办长廊', 'stone', [[3.0, 6.0, 2.5, 4.5]], [4.5, 3.4]],
  ['客卫', 'bath', [[6.06, 8.76, 2.56, 4.44]], [7.3, 3.6]],
  ['电梯厅', 'stone', [[3.4, 5.0, 0.24, 2.44]], [4.2, 1.4]],
  ['楼梯', null, [[5.0, 8.76, 0.24, 2.44]], [6.5, 1.8]],
];
FLOORS[4].use = '一室套房：阳台并入室内，衣帽卫浴洗衣一体区、卧室影音区、手办长廊';
const area = rects => rects.reduce((s, r) => s + (r[1] - r[0]) * (r[3] - r[2]), 0);

/* ---------- 场景 ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
} catch (e) {
  view.insertAdjacentHTML('beforeend', '<div id="err">这个浏览器没有开启 WebGL，无法显示 3D 模型。请换用 Chrome、Safari 或 Edge 打开。</div>');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.prepend(renderer.domElement);
const css2d = new CSS2DRenderer();
css2d.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
view.appendChild(css2d.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.3, 400);
camera.position.set(21, 16, 31);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 9, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 4; controls.maxDistance = 90;

scene.add(new THREE.HemisphereLight('#ffffff', '#a99c8c', 1.5));
const sun = new THREE.DirectionalLight('#fff4e6', 2.6);
sun.position.set(14, 32, 20);
sun.target.position.set(0, 8, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 90 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const std = (c, r = 0.9, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const M = {
  ext: std('#efebe3'), int: std('#f6f4ef', 0.95), col: std('#e8e3d9'), trim: std('#c4623a', 0.7),
  base: std('#8b4c37', 0.8), slab: std('#d4cfc5', 0.95), frame: std('#3a3f45', 0.5, 0.3),
  metal: std('#a3a8ad', 0.45, 0.6), door: std('#b5643c', 0.6), stair: std('#cfc8bb'),
  glass: new THREE.MeshStandardMaterial({ color: '#9fc4d6', transparent: true, opacity: 0.28, roughness: 0.05, metalness: 0.1, depthWrite: false, side: THREE.DoubleSide }),
  wood: std('#c9a77c', 0.8), tile: std('#dcd8d0', 0.6), bath: std('#c3ccd1', 0.5), stone: std('#d3ccbf', 0.8), deck: std('#a07a55', 0.85),
  fwood: std('#8a6a4c', 0.7), fabric: std('#8f9ba3', 0.95), rug: std('#b9b2a5', 1), linen: std('#ece8df', 0.95),
  white: std('#fbfbf9', 0.3), car: std('#4f6475', 0.35, 0.4), plant: std('#6f8f5b', 0.9), dark: std('#2f3438', 0.6),
};

const B = new THREE.Group(); B.position.set(-4.5, 0, -5); scene.add(B);
const G = {}, FURN = {}, LBL = {}; const FRONT = [];
for (let n = 1; n <= 7; n++) { G[n] = new THREE.Group(); FURN[n] = new THREE.Group(); G[n].add(FURN[n]); LBL[n] = []; B.add(G[n]); }

function box(g, x0, x1, y0, y1, z0, z1, mat, o = {}) {
  const w = x1 - x0, h = y1 - y0, d = z1 - z0;
  if (w < 0.005 || h < 0.005 || d < 0.005) return null;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = o.cast !== false && mat !== M.glass; m.receiveShadow = true;
  if (o.front) FRONT.push(m);
  g.add(m); return m;
}
function cyl(g, x, z, y0, h, r, mat) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 28), mat);
  m.position.set(x, y0 + h / 2, z); m.castShadow = m.receiveShadow = true; g.add(m); return m;
}
// 一段直墙：dir='x' 沿面宽方向（中心线 z=c），dir='z' 沿进深方向（中心线 x=c）。ops 为洞口 {a,b,s,t,k}
function wall(g, dir, c, from, to, y0, H, t, ops = [], mat = M.int, front = false) {
  const P = (a, b, ya, yb, th, m) => dir === 'x'
    ? box(g, a, b, ya, yb, c - th / 2, c + th / 2, m, { front })
    : box(g, c - th / 2, c + th / 2, ya, yb, a, b, m, { front });
  let cur = from;
  for (const o of [...ops].sort((p, q) => p.a - q.a)) {
    P(cur, o.a, y0, y0 + H, t, mat);
    const s = o.s || 0, tp = Math.min(o.t ?? H, H);
    if (s > 0) P(o.a, o.b, y0, y0 + s, t, mat);
    if (tp < H) P(o.a, o.b, y0 + tp, y0 + H, t, mat);
    const ya = y0 + s, yb = y0 + tp, a = o.a, b = o.b, f = 0.05, ft = 0.08;
    if (o.k === 'win' || o.k === 'gdoor') {
      P(a, b, ya, yb, 0.02, M.glass);
      P(a, b, ya, ya + f, ft, M.frame); P(a, b, yb - f, yb, ft, M.frame);
      P(a, a + f, ya, yb, ft, M.frame); P(b - f, b, ya, yb, ft, M.frame);
      const n = Math.max(1, Math.round((b - a) / 1.1));
      for (let i = 1; i < n; i++) { const x = a + (b - a) * i / n; P(x - f / 2, x + f / 2, ya, yb, ft, M.frame); }
      if (o.k === 'win' && yb - ya > 1.5) { const y = ya + (yb - ya) * 0.3; P(a, b, y - f / 2, y + f / 2, ft, M.frame); }
    } else if (o.k === 'shutter') {
      P(a, b, ya, yb, 0.05, M.metal);
      for (let y = ya + 0.2; y < yb - 0.05; y += 0.25) P(a, b, y, y + 0.02, 0.07, M.frame);
      P(a - 0.05, b + 0.05, yb - 0.3, yb, 0.3, M.metal);
    } else if (o.k === 'door1') {
      P(a, b, ya, yb, 0.05, M.door);
    } else if (o.k === 'door2') {
      const m = (a + b) / 2; P(a, m - 0.01, ya, yb, 0.06, M.door); P(m + 0.01, b, ya, yb, 0.06, M.door);
    }
    cur = o.b;
  }
  P(cur, to, y0, y0 + H, t, mat);
}
const W = (a, b, s, t, k = 'win') => ({ a, b, s, t, k });
const D = (a, b, t = 2.1) => ({ a, b, s: 0, t, k: 'door' });

function slab(g, y, x0, x1, z0, z1, holes = [], mat = M.slab) {

  for (const [a, b, c, d] of holes) { const p = new THREE.Path(); p.moveTo(a, c); p.lineTo(a, d); p.lineTo(b, d); p.lineTo(b, c); p.closePath(); s.holes.push(p); }
  const geo = new THREE.ExtrudeGeometry(s, { depth: SLAB, bevelEnabled: false }); geo.rotateX(Math.PI / 2);
  const m = new THREE.Mesh(geo, mat); m.position.y = y; m.castShadow = m.receiveShadow = true; g.add(m); return m;
}

}

function common(n) {

const FIG = ['#d9534f', '#f0ad4e', '#5bc0de', '#7b68ee', '#f5f5f5', '#3c3c3c', '#e87ea1', '#5cb85c'].map(c => std(c, 0.5));
const LED = new THREE.MeshStandardMaterial({ color: '#fff3d6', emissive: '#ffd9a0', emissiveIntensity: 1.4 });
// 手办展示柜：玻璃门 + 层板灯带 + 示意手办。open: 玻璃面朝向（'x+','x-','z+','z-' 或 'both-x'）
function displayCab(g, y, x0, x1, z0, z1, h, open) {
  const t = 0.03, alongZ = (z1 - z0) > (x1 - x0);
  // 背板、侧板、顶底
  if (open !== 'both-x') { if (open === 'x+') box(g, x0, x0 + t, y, y + h, z0, z1, M.dark); else if (open === 'x-') box(g, x1 - t, x1, y, y + h, z0, z1, M.dark); }
  if (alongZ) { box(g, x0, x1, y, y + h, z0, z0 + t, M.dark); box(g, x0, x1, y, y + h, z1 - t, z1, M.dark); }
  box(g, x0, x1, y, y + 0.1, z0, z1, M.dark); box(g, x0, x1, y + h - t, y + h, z0, z1, M.dark);
  // 层板 + 灯带 + 手办
  let k = 0;
  for (let s = y + 0.1; s < y + h - 0.3; s += 0.36) {
    box(g, x0 + t, x1 - t, s, s + 0.015, z0 + t, z1 - t, M.glass);
    box(g, x0 + t, x1 - t, s + 0.33, s + 0.34, z0 + t, z0 + t + 0.02, LED, { cast: false });
    for (let z = z0 + 0.14; z < z1 - 0.12; z += 0.2) {
      const m = FIG[(k++ * 5 + Math.floor(s * 7)) % FIG.length], hh = 0.12 + ((k * 37) % 13) / 100;
      const cx = (x0 + x1) / 2 + (((k * 13) % 3) - 1) * 0.06;
      box(g, cx - 0.04, cx + 0.04, s + 0.015, s + 0.015 + hh, z - 0.04, z + 0.04, m);
    }
  }
  // 玻璃门
  if (open === 'x+' || open === 'both-x') box(g, x1 - 0.01, x1, y + 0.1, y + h - t, z0, z1, M.glass);
  if (open === 'x-' || open === 'both-x') box(g, x0, x0 + 0.01, y + 0.1, y + h - t, z0, z1, M.glass);
}

const DIMMAT = new THREE.LineBasicMaterial({ color: '#b9552f', depthTest: false, transparent: true });

const mm = v => String(Math.round(v * 1000));
function dimLine(n, ax, a, b, c, y) {
  // ax='x'：沿面宽方向，从 a 到 b，位于 z=c；ax='z'：沿进深方向，位于 x=c
  const P = (u, off = 0) => ax === 'x' ? new THREE.Vector3(u, y, c + off) : new THREE.Vector3(c + off, y, u);
  const t = 0.12, pts = [P(a), P(b), P(a, -t), P(a, t), P(b, -t), P(b, t)];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  geo.setIndex([0, 1, 2, 3, 4, 5]);
  const l = new THREE.LineSegments(geo, DIMMAT); l.renderOrder = 998; DIMS[n].add(l);
  const d = document.createElement('div'); d.className = 'dim'; d.textContent = mm(b - a);
  const o = new CSS2DObject(d); o.position.copy(P((a + b) / 2)); DIMS[n].add(o); DIML[n].push(o);
}

    const [x0, x1, z0, z1] = rects.reduce((m, r) => area([r]) > area([m]) ? r : m);
    if (x1 - x0 > 0.9) dimLine(n, 'x', x0, x1, z0 + 0.3, y);
    if (z1 - z0 > 0.9) dimLine(n, 'z', z0, z1, x0 + 0.3, y);

}

const KIND = new Map([[M.ext, '外墙'], [M.int, '内墙'], [M.col, '柱'], [M.glass, '玻璃 / 窗'], [M.frame, '窗框 / 栏杆'], [M.stair, '楼梯踏步'],

const inFurn = o => { for (; o; o = o.parent) if (Object.values(FURN).includes(o)) return true; return false; };
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(B.children, true).find(h => h.object.isMesh && h.object.geometry.type === 'BoxGeometry' && shown(h.object));
  if (!hit) { tip.hidden = true; hl.visible = false; return; }

  const FK = new Map([[M.fabric, '沙发 / 椅子'], [M.linen, '床垫'], [M.fwood, '柜子 / 桌 / 床架'], [M.white, '洁具 / 厨柜'], [M.dark, '电视 / 显示器 / 柜体'], [M.plant, '绿植'], [M.rug, '地毯'], [M.car, '汽车'], [M.metal, '冰箱 / 金属']]);
  const furn = inFurn(m), kind = furn ? (FK.get(m.material) || '家具') : (KIND.get(m.material) || '构件');
  const isWall = /墙/.test(kind);
  const size = isWall ? `长 ${mm(Math.max(w, d))} × 厚 ${mm(Math.min(w, d))} × 高 ${mm(h)}`
    : `面宽 ${mm(w)} × 进深 ${mm(d)} × 高 ${mm(h)}`;
  const lo = m.getWorldPosition(wp).y - h / 2, floorN = [6, 5, 4, 3, 2, 1].find(n => lo >= LV[n].b - 0.2) || 1;
  const off = lo - LV[floorN].b;
  tip.innerHTML = `<b>${kind}</b><span>${size} mm</span>${off > 0.05 ? `<br><span>离地 ${mm(off)} mm</span>` : ''}`;
  tip.hidden = false;
  const tx = Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth - 8), ty = Math.max(8, e.clientY - r.top - tip.offsetHeight - 10);
  tip.style.left = tx + 'px'; tip.style.top = ty + 'px';

}
